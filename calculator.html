 <!DOCTYPE html>
<html>

<head>
    <title>My Calculator</title>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #60a5fa;
        }

        .calculator {
            width: 300px;
            margin: 30px auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 15px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 18px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>My Calculator</h1>

    <div class="calculator">

        <input type="number" id="num1" placeholder="First Number">

        <input type="number" id="num2" placeholder="Second Number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>

        <h2 id="result">Result: 0</h2>

    </div>

    <a href="index.html">← Back to Portfolio</a>

    <script>

        function calculate(operator) {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let result;

            if (operator === "+") {
                result = a + b;
            }

            else if (operator === "-") {
                result = a - b;
            }

            else if (operator === "*") {
                result = a * b;
            }

            else if (operator === "/") {
                result = a / b;
            }

            document.getElementById("result").innerText =
                "Result: " + result;
        }

    </script>

</body>

</html>
